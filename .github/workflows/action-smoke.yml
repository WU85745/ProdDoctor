name: Smoke test GitHub Action

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - bin/**
      - src/**
      - test/**
      - .github/workflows/action-smoke.yml
  pull_request:
    paths:
      - action.yml
      - bin/**
      - src/**
      - test/**
      - .github/workflows/action-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Minimal usage with current defaults
        uses: ./
        with:
          url: https://example.com
          retries: 1
          timeout: 15000

      - name: Expected content and exact status
        uses: ./
        with:
          url: https://example.com
          expect: Example Domain
          status: 200
          retries: 1
          timeout: 15000
          check_assets: true
          max_assets: 20
          tls_warn_days: 14

      - name: Assets can be disabled
        uses: ./
        with:
          url: https://example.com
          check_assets: false
