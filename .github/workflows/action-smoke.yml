# 内部狗粮测试：故意使用当前 checkout 的本地 Action（uses: ./）。
# 这不是给最终用户复制的示例；用户文档应锁定具体版本 tag 或完整 commit SHA。

name: Smoke test GitHub Action

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - bin/**
      - src/**
      - test/**
      - .github/workflows/action-smoke.yml
      - .github/workflows/release-please.yml
  pull_request:
    paths:
      - action.yml
      - bin/**
      - src/**
      - test/**
      - .github/workflows/action-smoke.yml
      - .github/workflows/release-please.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Minimal usage with current defaults
        uses: ./
        with:
          url: https://example.com
          retries: 1
          timeout: 15000

      - name: Expected content and exact status in Chinese
        uses: ./
        with:
          url: https://example.com
          language: zh-CN
          expect: Example Domain
          status: 200
          retries: 1
          timeout: 15000
          check_assets: true
          max_assets: 20
          tls_warn_days: 14

      - name: Assets can be disabled
        uses: ./
        with:
          url: https://example.com
          check_assets: false
