# 内部狗粮测试：故意使用当前 checkout 的本地 Action（uses: ./）。
# 这不是给最终用户复制的示例；用户文档应锁定具体版本 tag 或完整 commit SHA。

name: Browser smoke test

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - bin/**
      - src/browser.mjs
      - src/checker.mjs
      - src/report.mjs
      - src/html-report.mjs
      - .github/workflows/browser-smoke.yml
  pull_request:
    paths:
      - action.yml
      - bin/**
      - src/browser.mjs
      - src/checker.mjs
      - src/report.mjs
      - src/html-report.mjs
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run ProdDoctor with Chromium evidence
        uses: ./
        with:
          url: https://example.com
          status: 200
          browser: true
          browser_expect: Example Domain
          browser_timeout: 30000
          browser_settle: 250
          browser_fail_console: false
          browser_profile: mobile
          browser_trace: always
          upload_screenshot: true
          upload_report: true

      - name: Verify evidence bundle
        shell: bash
        run: |
          test -s proddoctor-evidence/browser.png
          test -s proddoctor-evidence/trace.zip
          test -s proddoctor-evidence/report.json
          test -s proddoctor-evidence/report.html

          grep -q 'ProdDoctor Production Report' proddoctor-evidence/report.html
          grep -q '"profile": "mobile"' proddoctor-evidence/report.json
          grep -q '"version": "1.4.0"' proddoctor-evidence/report.json
